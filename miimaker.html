<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mii Maker</title>
  <link href="./fontfiles/font.css" rel="stylesheet">
  <style>

    .nunito-variable {
      font-family: 'Nunito Sans', sans-serif;
      font-optical-sizing: auto;
      font-weight: 800;
      font-style: italic;
      font-variation-settings: "wdth" 100, "YTLC" 500;
    }

    </style>
  <style>
    /* For WebKit browsers */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
      position: absolute;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(0, 123, 255, 0.6); /* light grey */
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(0, 123, 255, 0.9);
    }

    /* Optional: Makes scrollbar overlay the content, like on macOS */
    html {
      scrollbar-width: thin; /* For Firefox */
      scrollbar-color: rgba(0, 123, 255, 0.6) transparent;
    }

    body {
      overflow: overlay; /* Use `overlay` instead of `scroll` for WebKit to overlay scrollbar */
    }
    /* --- Add “Add My Face” button --- */
    #add-face-btn {
      position: absolute;
      bottom: 10px;
      right: 10px;
      padding: 6px 12px;
      font-size: 14px;
      font-family: 'Nunito Sans', sans-serif;
      font-weight: 800;
      background: #dbdbdb;
      color: #292929;
      filter: drop-shadow(0px 7px 15px #545454);
      border: none;
      border-radius: 24px;
      display: flex;
      align-items: center;
      transition: 0.2s;
      gap: 6px;
      cursor: pointer;
      z-index: 500;
    }

    #add-face-btn:hover {
      transition: 0.2s;
      scale: 1.05;
    }

    #add-face-btn:active {
      filter: drop-shadow(0px 0px 0px #545454);
      transition: 0.2s;
      scale: 0.85;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.8) inset;
    }

    .face-capture-buttons button {
      padding: 6px 12px;
      font-size: 14px;
      font-family: 'Nunito Sans', sans-serif;
      font-weight: 800;
      background: #c3d3de;
      color: #292929;
      filter: drop-shadow(0px 7px 7px #878787);
      border: none;
      border-radius: 24px;
      transition: 0.2s;
      gap: 6px;
      cursor: pointer;
    }

    .face-capture-buttons button:hover {
      transition: 0.2s;
      scale: 1.05;
    }

    .face-capture-buttons button:active {
      filter: drop-shadow(0px 0px 0px #545454);
      transition: 0.2s;
      scale: 0.85;
      box-shadow: 0 0 20px rgba(64, 64, 64, 0.8) inset;
    }

    /* when in “Remove face” mode, make the button red */
    #add-face-btn.remove-ready {
      background: #d9928b;  /* cherry-red */
      border-color: #c0392b;
      color: #382624;
    }


    /* Don’t let the #preview img rule grab the button icon */
    #add-face-btn img {
      position: static !important;
      top: auto !important;
      left: auto !important;
      margin-right: 0px;
      margin-left: 16px;
      vertical-align: middle;
    }


    /* --- Face‐capture overlay + controls --- */
    .face-capture-overlay {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 300px; height: 300px;
      padding: 84px;
      box-sizing: border-box;
      border-radius: 50%;
      overflow: hidden;
      display: none;
      z-index: 1;
    }

    #preview_hairs {
      z-index: 2;
    }

    #preview_eyewear {
      z-index: 2;
    }

    #preview_hats {
      z-index: 2;
    }
    .face-capture-overlay video,
    .face-capture-overlay img {
      width: 100%; height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }
    .face-capture-buttons {
      position: absolute;
      top: calc(50% + 180px);
      left: 50%; transform: translateX(-50%);
      display: flex; gap: 10px;
      z-index: 500;
    }
    .face-capture-buttons button {
      padding: 8px 14px;
      font-size: 14px;
    }

  </style>

  <style>
    :root {
      /* Global sizing */
      --emoji-size: 200px;
      --torso-size: 100px;
      /* Positions relative to preview center */
      --head-top-offset: calc(50% - var(--emoji-size) / 2);
      --torso-top-offset: calc( var(--head-top-offset) + var(--emoji-size) - var(--torso-size) / 2 );
    }
    body {
      font-family: 'Nunito Sans', sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      background-color: #fff;
      height: 100vh;
      overflow: hidden;
    }
    #sidebar {
      width: 300px;
      border-top-left-radius: 30px;
      border-bottom-left-radius: 30px;
      overflow-y: auto;
      padding: 1rem;
      background: #f0f0f0;
      box-sizing: border-box;
    }
    #main { flex: 1; display: flex; flex-direction: column; }
    #config {
      padding: 0.5rem;
      border-bottom: 1px solid #ccc;
      display: flex;
      gap: 1rem;
    }
    #config input { flex: 1; padding: 0.25rem; }
    #content { flex: 1; display: flex; overflow: hidden; }
    #preview {
      flex: 1;
      position: relative;
    }
    /* Head, mouth, eyes, etc. all share this fixed centered position */
    #preview img {
      position: absolute;
      width: var(--emoji-size);
      height: var(--emoji-size);
      top: var(--head-top-offset);
      left: 50%;
      transform: translateX(-50%);
    }
    /* Torso dot in fixed relation to head */
    #torso-dot {
      position: absolute;
      width: var(--torso-size);
      height: var(--torso-size);
      top: var(--torso-top-offset);
      left: 50%;
      transform: translateX(-50%);
      margin-top: 20px;
      filter: blur(7px);
      opacity: 0.5;
      background: #333;
      border-radius: 50%;
    }
    .control-group { margin-bottom: 1rem; }
    .control-group h4 { margin: 0 0 0.5rem; color: #575757; font-size: 1.2rem; }
    .options { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .options img, .options .dot {
      width: 40px;
      height: 40px;
      cursor: pointer;
      background: #fff;
      border: 2px solid transparent;
      border-radius: 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s;
    }
    .options img:hover, .options .dot:hover { z-index: 999; box-shadow: 0 4px 14px rgba(0,0,0,0.4); transform: scale(1.5); }
    .options img:active, .options .dot:active { transform: scale(0.95); }
    .options img.selected, .options .dot.selected { border-color: #007bff; }
    .dot { border-radius: 50%; }
    #layersText, #hairColorText { width: 100%; }
    @keyframes sparkle {
      0% { opacity: 1; transform: scale(0.5) rotate(0deg); }
      100% { opacity: 0; transform: scale(2) rotate(45deg); }
    }
    .sparkle {
      position: absolute;
      /* center over emoji */
      top: 50%; left: 50%;
      width: var(--emoji-size);\

      height: var(--emoji-size);
      background: url('https://icons.iconarchive.com/icons/google/noto-emoji-activities/512/52705-sparkles-icon.png') center/contain no-repeat;
      pointer-events: none;
      transform: translate(-50%, -50%);
      animation: sparkle 0.6s ease-out;
    }
  </style>
  <style>
    .video-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -9999;
    }

    video {
      object-fit: cover;
      width: 100%;
      height: 100%;
    }
    /* mirror horizontally */
    #face-video {
      transform: scaleX(-1);
    }

    /* if you also want the preview image flipped too: */
    #face-preview-img {
      transform: scaleX(-1);
    }
  </style>
  <style>
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Nunito Sans', sans-serif;
      background-color: #333;
      color: white;
      padding: 12px 20px;
      border-radius: 28px;
      font-size: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease, transform 0.4s ease;
      z-index: 9999;
    }

    .toast.show {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }
  </style>

  </head>
</head>
<body>
  <div id="main">
    <div style="display:none" id="config">
      <input type="text" id="layersText" placeholder="Layer list will appear here"/>
      <input type="text" id="hairColorText" placeholder="Hair color will appear here"/>
    </div>
    <div id="content">
      <div id="preview">
        <div id="torso-dot"></div>
        <!-- Add‐My‐Face trigger -->
        <button id="add-face-btn">
          Add my face
          <img src="./icons/camera.svg" alt="📷" width="16" height="16">
        </button>
        <canvas id="canvas" width="512" height="512" style="display:none;"></canvas>

        <!-- Overlay for live video & capture -->
        <div id="face-overlay" class="face-capture-overlay">
          <video id="face-video" autoplay playsinline></video>
          <img id="face-preview-img" style="display:none;">
        </div>

        <!-- Capture/Cancel or Apply/Redo/Cancel buttons -->
        <div id="face-controls" class="face-capture-buttons" style="display:none;">
          <button id="face-capture-btn">Capture</button>
          <button id="face-cancel-btn">Cancel</button>
        </div>

      </div>
      <div id="sidebar"></div>
    </div>
  </div>
  <div class="video-container">
    <video autoplay loop muted>
      <source src="./bg.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>
  </div>
  <script>
    const categories = ['orbs','mouths','eyes','hairs','eyewear','hats'];
    const counts = { orbs: 4, mouths: 4, eyes: 14, hairs: 12, eyewear: 6, hats: 15 };
    const layerKey = 'mii_layers';
    const hairColorKey = 'mii_hair_color';

    const sidebar = document.getElementById('sidebar');
    const preview = document.getElementById('preview');
    const layersText = document.getElementById('layersText');
    const hairColorText = document.getElementById('hairColorText');

    const previewImgs = {};
    categories.forEach(cat => {
      const img = document.createElement('img');
      img.id = `preview_${cat}`;
      preview.appendChild(img);
      previewImgs[cat] = img;
    });

    const hairFilters = {
      gray: 'grayscale(100%)',
      brown: 'hue-rotate(280deg) contrast(200%) brightness(150%)',
      black: 'brightness(0%)',
      blonde: 'hue-rotate(290deg) contrast(120%) brightness(300%)',
      red: 'hue-rotate(260deg) contrast(190%) brightness(300%)'
    };

    function getSavedLayers() {
      const text = layersText.value.trim();
      if (text) return text.split(',').map(s => s.trim());
      const saved = localStorage.getItem(layerKey);
      if (saved) return saved.split(',').map(s => s.trim());
      return categories.map(cat => `./emoji/${cat}/1.png`);
    }

    function getSavedHairColor() {
      return localStorage.getItem(hairColorKey) || 'gray';
    }

    function saveAndUpdateLayers(layers) {
      layersText.value = layers.join(', ');
      localStorage.setItem(layerKey, layers.join(', '));
      updatePreview(layers);
      updateControls(layers);
      showSparkle();
    }

    function saveAndUpdateHairColor(color) {
      hairColorText.value = color;
      localStorage.setItem(hairColorKey, color);
      previewImgs['hairs'].style.filter = hairFilters[color] || '';
      updateHairColorControls(color);
      showSparkle();
    }

    function updatePreview(layers) {
      layers.forEach((url, idx) => {
        const cat = categories[idx];
        previewImgs[cat].src = decodeURIComponent(url);
      });
      const savedColor = getSavedHairColor();
      previewImgs['hairs'].style.filter = hairFilters[savedColor];
    }

    function updateControls(layers) {
      categories.forEach((cat, idx) => {
        const groupDiv = document.querySelector(`#group_${cat}`);
        if (!groupDiv) return;
        groupDiv.querySelectorAll('img').forEach(img => {
          img.classList.toggle('selected', img.dataset.url === layers[idx]);
        });
      });
    }

    function updateHairColorControls(selected) {
      document.querySelectorAll('.dot').forEach(dot => {
        dot.classList.toggle('selected', dot.dataset.color === selected);
      });
    }

    function onOptionClick(cat, url) {
      const layers = getSavedLayers();
      layers[categories.indexOf(cat)] = url;
      saveAndUpdateLayers(layers);
      showToastOnce();
    }
    function onHairColorClick(color) {
      saveAndUpdateHairColor(color);
      showToastOnce();
    }

    function showSparkle() {
      const s = document.createElement('div');
      s.className = 'sparkle';
      preview.appendChild(s);
      setTimeout(() => preview.removeChild(s), 600);
    }

    // build controls
    categories.forEach(cat => {
      const group = document.createElement('div');
      group.className = 'control-group';
      group.id = `group_${cat}`;
      const title = document.createElement('h4');
      title.textContent = cat.charAt(0).toUpperCase() + cat.slice(1);
      group.appendChild(title);
      const opts = document.createElement('div'); opts.className = 'options';
      for (let i = 1; i <= counts[cat]; i++) {
        const img = document.createElement('img');
        const url = `./emoji/${cat}/${i}.png`;
        img.src = url; img.dataset.url = url;
        img.addEventListener('click', () => onOptionClick(cat, url));
        opts.appendChild(img);
      }
      group.appendChild(opts);
      sidebar.appendChild(group);
      if (cat === 'hairs') {
        const colorGroup = document.createElement('div');
        colorGroup.className = 'control-group';
        colorGroup.id = 'group_haircolor';
        const t2 = document.createElement('h4'); t2.textContent = 'Hair Color';
        colorGroup.appendChild(t2);
        const opts2 = document.createElement('div'); opts2.className = 'options';
        Object.keys(hairFilters).forEach(color => {
          const dot = document.createElement('div');
          dot.className = 'dot';
          dot.style.background = color === 'blonde' ? 'yellow' : color;
          dot.dataset.color = color;
          dot.addEventListener('click', () => onHairColorClick(color));
          opts2.appendChild(dot);
        });
        colorGroup.appendChild(opts2);
        sidebar.appendChild(colorGroup);
      }
    });

    function blinkCycle() {
      // Check if any decoded preview image source contains "data:image"
      const hasDataImage = Object.values(previewImgs).some(img => {
        try {
          return decodeURIComponent(img.src).startsWith('data:image');
        } catch {
          return false;
        }
      });

      if (hasDataImage) return; // Stop the blink cycle entirely

      const eyeImg = previewImgs['eyes'];
      const original = eyeImg.src;
      eyeImg.src = './emoji/eyes/blink.png';
      setTimeout(() => { eyeImg.src = original; }, 200);
      setTimeout(blinkCycle, 2000 + Math.random() * 3000);
    }


    layersText.addEventListener('change', () => {
      const layers = getSavedLayers();
      if (layers.length === categories.length) saveAndUpdateLayers(layers);
    });
    hairColorText.addEventListener('change', () => {
      const color = hairColorText.value.trim();
      if (hairFilters[color]) saveAndUpdateHairColor(color);
    });

    document.addEventListener('DOMContentLoaded', () => {
      saveAndUpdateLayers(getSavedLayers());
      saveAndUpdateHairColor(getSavedHairColor());
      setTimeout(blinkCycle, 3000 + Math.random() * 2000);
    });

    // --- Element refs ---
    const canvas        = document.getElementById('canvas');
    const addFaceBtn    = document.getElementById('add-face-btn');
    const faceOverlay   = document.getElementById('face-overlay');
    const faceVideo     = document.getElementById('face-video');
    const facePreviewImg= document.getElementById('face-preview-img');
    const faceControls  = document.getElementById('face-controls');
    let captureBtn      = document.getElementById('face-capture-btn');
    let cancelBtn       = document.getElementById('face-cancel-btn');

    let originalEyeUrl, savedLayers;

    // Start capture: show video + Capture/Cancel
    async function startFaceCapture() {
      const eyeImg = previewImgs['eyes'];
      originalEyeUrl = eyeImg.src;
      savedLayers = getSavedLayers();

      addFaceBtn.style.display    = 'none';
      eyeImg.style.display        = 'none';
      faceOverlay.style.display   = 'block';
      faceVideo.style.display     = 'block';
      facePreviewImg.style.display= 'none';
      faceControls.style.display  = 'flex';

      // reset controls to capture/cancel
      faceControls.innerHTML = `
        <button id="face-capture-btn">Capture</button>
        <button id="face-cancel-btn">Cancel</button>
      `;
      bindInitialControls();

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        faceVideo.srcObject = stream;
      } catch {
        alert('Camera access denied');
      }
    }

    // Bind Capture & Cancel
    function bindInitialControls() {
      captureBtn = document.getElementById('face-capture-btn');
      cancelBtn  = document.getElementById('face-cancel-btn');
      captureBtn.addEventListener('click', captureHandler);
      cancelBtn.addEventListener('click', resetFaceUI);
    }

    // Capture handler: switch to preview + Apply/Redo/Cancel
    function captureHandler() {
    const ctx = canvas.getContext('2d');
    const finalSize = 512, padding = 88;
    canvas.width = canvas.height = finalSize;
    ctx.clearRect(0, 0, finalSize, finalSize);

    // 1) set up circular clip
    ctx.save();
    ctx.beginPath();
    ctx.arc(finalSize/2, finalSize/2, (finalSize - padding*2)/2, 0, 2*Math.PI);
    ctx.clip();

    // 2) flip horizontally
    ctx.translate(finalSize, 0);
    ctx.scale(-1, 1);

    // 3) draw the video
    const size = Math.min(faceVideo.videoWidth, faceVideo.videoHeight);
    const sx = (faceVideo.videoWidth - size)/2;
    const sy = (faceVideo.videoHeight - size)/2;
    // note: destination coords still use padding
    ctx.drawImage(
      faceVideo,
      sx, sy, size, size,
      padding, padding,
      finalSize - padding*2,
      finalSize - padding*2
    );

    // 4) restore your transform+clip
    ctx.restore();

      // stop camera
      faceVideo.srcObject.getTracks().forEach(t => t.stop());

      // build data URL
      let raw;
      try { raw = canvas.toDataURL('image/webp', .75); }
      catch { raw = canvas.toDataURL('image/png'); }
      const encoded = encodeURIComponent(raw);

      // show captured image
      facePreviewImg.src             = decodeURIComponent(encoded);
      faceVideo.style.display        = 'none';
      facePreviewImg.style.display   = 'block';

      // switch controls
      faceControls.innerHTML = `
        <button id="face-apply-btn">Apply</button>
        <button id="face-redo-btn">Redo</button>
        <button id="face-cancel2-btn">Cancel</button>
      `;
      bindPostCaptureControls(encoded);
    }

    // Bind Apply, Redo, Cancel after capture
    function bindPostCaptureControls(encoded) {
      const layers = getSavedLayers();
      document.getElementById('face-apply-btn').addEventListener('click', () => {
        const layers = savedLayers.slice();
        layers[2] = encoded;               // eyes index
        saveAndUpdateLayers(layers);
        showToastOnce();
        // Delay the manual replacement slightly
        const decodedDataUrl = decodeURIComponent(encoded);
        setTimeout(() => {
          const eyeImgEl = document.getElementById('preview_eyes');
          eyeImgEl.src = decodedDataUrl; 
          updateFaceButtonText();
        }, 100);  // 100ms delay

        resetFaceUI();
      });



      document.getElementById('face-redo-btn').addEventListener('click', () => {
        // restart capture
        startFaceCapture();
      });
      document.getElementById('face-cancel2-btn').addEventListener('click', resetFaceUI);
    }

    // Reset entire face-capture UI
    function resetFaceUI() {
      // stop camera if still running
      if (faceVideo.srcObject)
        faceVideo.srcObject.getTracks().forEach(t => t.stop());

      // restore eyes
      previewImgs['eyes'].src         = originalEyeUrl;
      previewImgs['eyes'].style.display = '';

      // hide overlay & controls, show add button
      faceOverlay.style.display      = 'none';
      faceControls.style.display     = 'none';
      addFaceBtn.style.display       = '';
    }

    // kick off binding
    addFaceBtn.addEventListener('click', startFaceCapture);
    // 1) Helper to set the button text + icon
    function updateFaceButtonText() {
      const layers = getSavedLayers();
      const isDefaultEye = layers[2].endsWith('.png');

      if (isDefaultEye) {
        addFaceBtn.innerHTML = 
          '<img src="./emoji/lily.jpg" ' +
              'alt="custom face" ' +
              'style="width:26px; height:26px; border-radius:50%;">' +
          'Add custom face';
      } else {
        addFaceBtn.innerHTML = 
          '<img src="./emoji/lily.jpg" ' +
              'alt="custom face" ' +
              'style="opacity: 0.5; width:26px; height:26px; border-radius:50%;">' +
          'Remove custom face';
      }

      addFaceBtn.classList.toggle('remove-ready', !isDefaultEye);
    }


    // 2) Override the single click handler to toggle add vs remove
    addFaceBtn.removeEventListener('click', startFaceCapture);
    addFaceBtn.addEventListener('click', () => {
      const layers = getSavedLayers();
      const isDefaultEye = layers[2].endsWith('/eyes/1.png');

      if (isDefaultEye) {
        // launch the capture UI
        startFaceCapture();
      } else {
        // remove custom face → reset to 1.png
        const newLayers = layers.slice();
        newLayers[2] = './emoji/eyes/1.png';
        saveAndUpdateLayers(newLayers);

        // immediate preview swap
        const eyeEl = document.getElementById('preview_eyes');
        eyeEl.src = newLayers[2];

        // reset button
        updateFaceButtonText();
      }
    });

    // 3) Whenever you Apply a new face, call updateFaceButtonText()
    //    (and also once on initial page load)
    document.addEventListener('DOMContentLoaded', updateFaceButtonText);

  </script>
  <script>
    let toastShown = false;

    function showToastOnce(message = "Visual changes to your OOSmoji will take effect on restart") {
      if (toastShown) return;
      toastShown = true;

      const toast = document.createElement("div");
      toast.className = "toast";
      toast.textContent = message;
      document.body.appendChild(toast);

      // Trigger animation
      requestAnimationFrame(() => toast.classList.add("show"));

      // Remove after 3 seconds
      setTimeout(() => {
        toast.classList.remove("show");
        setTimeout(() => toast.remove(), 400);
      }, 6000);
    }

  </script>
  <script>
document.addEventListener('DOMContentLoaded', () => {
  // 1. Disable right-click context menu globally
  document.addEventListener('contextmenu', e => {
    e.preventDefault();
  });

  // 2. Block Ctrl+I, Ctrl+U, Ctrl+S
  document.addEventListener('keydown', e => {
    if (e.ctrlKey) {
      const forbidden = ['i', 'u', 's'];
      if (forbidden.includes(e.key.toLowerCase())) {
        e.preventDefault();
      }
    }
  });

  // 3. Prevent dragging of any element (images, links, etc.)
  document.addEventListener('dragstart', e => {
    e.preventDefault();
  });

  // 4. Disable text selection except inside inputs/textareas
  document.addEventListener('selectstart', e => {
    const tag = e.target.tagName.toLowerCase();
    if (tag !== 'input' && tag !== 'textarea') {
      e.preventDefault();
    }
  });
});
</script>
<script>
(function() {
  const bgAudioFile = './bg.mp3';
  const FADE_DURATION = 1.5; // seconds

  // Audio setup
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const gainNode = audioCtx.createGain();
  gainNode.gain.value = 0;
  const audioEl = new Audio(bgAudioFile);
  audioEl.loop = true;
  const source = audioCtx.createMediaElementSource(audioEl);
  source.connect(gainNode).connect(audioCtx.destination);

  // Fade-in
  function playAudio() {
    // don't play if user disabled
    if (localStorage.getItem('bgAudioDisabled') === 'true') return;
    audioCtx.resume();
    gainNode.gain.cancelScheduledValues(audioCtx.currentTime);
    gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
    gainNode.gain.linearRampToValueAtTime(1, audioCtx.currentTime + FADE_DURATION);
    audioEl.play();
  }

  // Fade-out
  function pauseAudio() {
    gainNode.gain.cancelScheduledValues(audioCtx.currentTime);
    gainNode.gain.setValueAtTime(gainNode.gain.value, audioCtx.currentTime);
    gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + FADE_DURATION);
    setTimeout(() => audioEl.pause(), FADE_DURATION * 1000);
  }

  // Watch localStorage flag every second
  let lastState = localStorage.getItem('bgAudioDisabled');
  setInterval(() => {
    const curr = localStorage.getItem('bgAudioDisabled');
    if (curr !== lastState) {
      lastState = curr;
      if (curr === 'true') pauseAudio();
      else playAudio();
    }
  }, 1000);

  // Pause/resume on tab visibility
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) pauseAudio();
    else playAudio();
  });

  // Fallback blur/focus
  window.addEventListener('blur',  pauseAudio);
  window.addEventListener('focus', playAudio);

  // Initial play/pause on load
  window.addEventListener('DOMContentLoaded', () => {
    if (localStorage.getItem('bgAudioDisabled') === 'true') pauseAudio();
    else playAudio();
  });
})();
</script>

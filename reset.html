<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Resetting Offline Cache…</title>
  <script>
    async function resetOfflineCacheOnly() {
      // 1. Unregister all service workers
      if ('serviceWorker' in navigator) {
        const registrations = await navigator.serviceWorker.getRegistrations();
        for (const reg of registrations) {
          await reg.unregister();
          console.log('✅ Unregistered service worker:', reg.scope);
        }
      }

      // 2. Delete all service worker caches (leave localStorage and IndexedDB alone)
      if ('caches' in window) {
        const cacheNames = await caches.keys();
        for (const name of cacheNames) {
          await caches.delete(name);
          console.log('🗑️ Deleted cache:', name);
        }
      }

      // 3. Optional: reload or redirect (you can change this to whatever you want)
      setTimeout(() => {
        window.location.href = 'save.html'; // reload your offline setup page
      }, 500);
    }

    window.addEventListener('DOMContentLoaded', resetOfflineCacheOnly);
  </script>
</head>
<body>
  <h1>Clearing Offline Files…</h1>
  <p>This will remove cached files but keep your saved data.</p>
</body>
</html>

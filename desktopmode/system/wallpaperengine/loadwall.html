<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fullscreen iFrame</title>
<style>
    body, html {
        margin: 0;
        padding: 0;
        overflow: hidden;
        height: 100%;
    }
    iframe {
        width: 100%;
        height: 100%;
        border: none;
    }
</style>
</head>
<body>
    <iframe src="" id="iframe"></iframe>

    <script>
        // Retrieve saved URL from local storage
        var savedURL = localStorage.getItem('savedURL');
        if (savedURL) {
            // Set the URL of the iframe
            document.getElementById('iframe').src = savedURL;
        } else {
            // Default URL if no URL is saved
            document.getElementById('iframe').src = 'default.html';
        }
    </script>
</body>
</html>

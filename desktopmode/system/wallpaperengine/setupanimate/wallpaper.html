<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Wallpaper</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100%;
        }

        .layer {
            position: absolute;
            width: 100%;
            height: 100%;
            background-size: cover;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
        }

        .layer1 {
            background-image: url('./layer1.png');
            animation-name: move1;
z-index: -8;
            animation-duration: 20s;
        }

        .layer2 {
            background-image: url('./layer2.png');
            animation-name: move2;
z-index: -7;
            animation-duration: 25s;
        }

        .layer3 {
            background-image: url('./layer3.png');
            animation-name: move3;
z-index: -8;
            animation-duration: 30s;
        }

        .layer5 {
            background-image: url('./layer5.png');
            animation-name: move5;
z-index: -6;
            animation-duration: 20s;
        }

        .layer6 {
            background-image: url('./layer6.png');
            animation-name: move6;
z-index: -7;
            animation-duration: 25s;
        }

        .layer7 {
            background-image: url('./layer7.png');
            animation-name: move7;
z-index: -8;
            animation-duration: 30s;
        }

        .layer4 {
            background-image: url('./layer4.png');
	    z-index: -9;
            /* This layer doesn't move */
        }

        @keyframes move1 {
            0% { transform: translateY(0); }
            50% { transform: translateY(8%); }
            100% { transform: translateY(0); }
        }

        @keyframes move2 {
            0% { transform: translateY(5%); }
            50% { transform: translateY(0); }
            100% { transform: translateY(5%); }
        }

        @keyframes move3 {
            0% { transform: translateY(20%); }
            50% { transform: translateY(0); }
            100% { transform: translateY(20%); }
        }
        @keyframes move5 {
            0% { transform: translateY(0); }
            50% { transform: translateY(4%); }
            100% { transform: translateY(0); }
        }

        @keyframes move6 {
            0% { transform: translateY(2%); }
            50% { transform: translateY(0); }
            100% { transform: translateY(2%); }
        }

        @keyframes move7 {
            0% { transform: translateY(10%); }
            50% { transform: translateY(0); }
            100% { transform: translateY(10%); }
        }
    </style>
</head>
<body>
    <div class="layer layer1"></div>
    <div class="layer layer2"></div>
    <div class="layer layer3"></div>
    <div class="layer layer5"></div>
    <div class="layer layer6"></div>
    <div class="layer layer7"></div>
    <div class="layer layer4"></div>
</body>
</html>

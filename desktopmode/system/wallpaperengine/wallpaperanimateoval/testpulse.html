<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fullscreen Images</title>
<style>
    body, html {
        margin: 0;
        padding: 0;
        height: 100%;
    }
    .background {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: url('./images/OvalOSWallpaper_bg.png'); /* Change 'background.jpg' to the URL of your background image */
        background-size: cover;
        background-position: center;
        z-index: -1;
    }
    .fullscreen-image {
        position: fixed;
        top: 0;
        left: 14%;
        width: 70%;
        height: 100%;
        z-index: 0;
        opacity: 0; /* Initially hide images */
    }
    /* Define animations for each image */
    @keyframes image1 {
        0% { transform: scale(0) translate(0, 100%); opacity: 0; }
        100% { transform: scale(1) translate(0, 0); opacity: 1; }
    }
    @keyframes pulse1 {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(0.98); opacity: 1; }
    }
    @keyframes pulse2 {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(0.98); opacity: 1; }
    }
    @keyframes image4 {
        0% { transform: scale(0); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
    }
    @keyframes image5 {
        0% { transform: scale(0); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
    }
    @keyframes image6 {
        0% { transform: scale(0); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
    }
    @keyframes image7 {
        0% { transform: scale(0); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
    }
    @keyframes image8 {
        0% { transform: scale(0); opacity: 0; filter: blur(5px); }
        100% { transform: scale(1); opacity: 1; filter: blur(0); }
    }
    @keyframes image9 {
        0% { transform: scale(0) translate(0, 100%); opacity: 0; }
        100% { transform: scale(1) translate(0, 0); opacity: 1; }
    }
</style>
</head>
<body>
<div class="background"></div>
<img class="fullscreen-image" src="./images/OvalOSWallpaper_smalldotblueright.png" alt="Image 1" style="animation: image1 0.6s 1.3s forwards;">
<img class="fullscreen-image" src="./images/OvalOSWallpaper_smalldotgreenleft.png" alt="Image 2" style="animation: pulse1 0.6s 1.2s infinite;">
<img class="fullscreen-image" src="./images/OvalOSWallpaper_smalldotgreenright.png" alt="Image 3" style="animation: pulse2 0.6s 1.2s infinite;">
<img class="fullscreen-image" src="./images/OvalOSWallpaper_bigdotgreenleft.png" alt="Image 4" style="animation: image4 0.6s 1.1s forwards;">
<img class="fullscreen-image" src="./images/OvalOSWallpaper_bigdotgreenright.png" alt="Image 5" style="animation: image5 0.6s 1.1s forwards;">
<img class="fullscreen-image" src="./images/OvalOSWallpaper_blueovalbottom.png" alt="Image 6" style="animation: image6 0.6s 1s forwards;">
<img class="fullscreen-image" src="./images/OvalOSWallpaper_blueovaltop.png" alt="Image 7" style="animation: image7 0.6s 1s forwards;">
<img class="fullscreen-image" src="./images/OvalOSWallpaper_blueovalmiddle.png" alt="Image 8" style="animation: image8 0.6s 0.5s forwards;">
<img class="fullscreen-image" src="./images/OvalOSWallpaper_yellowcirclemiddle.png" alt="Image 9" style="animation: image9 0.6s 0.9s forwards;">
</body>
</html>

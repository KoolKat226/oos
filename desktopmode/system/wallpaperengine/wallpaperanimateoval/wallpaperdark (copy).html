<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fullscreen Images</title>
<style>
    body, html {
        margin: 0;
        padding: 0;
        height: 100%;
    }
    .background {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: url('./imagesdark/OvalOSWallpaper_bg.png'); /* Change 'background.jpg' to the URL of your background image */
        background-size: cover;
        background-position: center;
        z-index: -1;
    }

    @keyframes pulse1 {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(0.98); opacity: 1; }
    }
    @keyframes pulse2 {
        50% { transform: scale(1); opacity: 1; }
        0%, 100% { transform: scale(0.98); opacity: 1; }
    }

.fullscreen-image {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    margin-left: auto;
    margin-right: auto;
    height: 100%;
    z-index: 0;
    animation-duration: 0.6s;
    animation-timing-function: ease-out;
    animation-fill-mode: forwards;
    opacity: 0; /* Initially hide images */
}


/* Define animations for each image */
@keyframes image1 {
    0% { transform: scale(0) translate(0, 100%); opacity: 0; }
    100% { transform: scale(1) translate(0, 0); opacity: 1; }
}

@keyframes image2 {
    0% { transform: scale(0) translate(0, 100%); opacity: 0; }
    100% { transform: scale(1) translate(0, 0); opacity: 1; }
    99.9% { opacity: 1; }
    100% { opacity: 0; }
}

@keyframes image3 {
    0% { transform: scale(0) translate(0, 100%); opacity: 0; }
    100% { transform: scale(1) translate(0, 0); opacity: 1; }
    99.9% { opacity: 1; }
    100% { opacity: 0; }
}

@keyframes image4 {
    0% { transform: scale(0); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
}

@keyframes image5 {
    0% { transform: scale(0); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
}

@keyframes image6 {
    0% { transform: scale(0); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
}

@keyframes image7 {
    0% { transform: scale(0); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
}

@keyframes image8 {
    0% { transform: scale(0); opacity: 0; filter: blur(5px); }
    100% { transform: scale(1); opacity: 1; filter: blur(0); }
}

@keyframes image9 {
    0% { transform: scale(0) translate(0, 100%); opacity: 0; }
    100% { transform: scale(1) translate(0, 0); opacity: 1; }
}

</style>
</head>
<body>
<div class="background"></div>
<img class="fullscreen-image" src="./imagesdark/OvalOSWallpaper_smalldotblueright.png" alt="Image 1" style="animation-name: image1; animation-delay: 6.6s;">
<img class="fullscreen-image" src="./imagesdark/OvalOSWallpaper_smalldotgreenleft.png" alt="pulse 1" style="animation: pulse1 0.8s 7.1s infinite;">
<img class="fullscreen-image" src="./imagesdark/OvalOSWallpaper_smalldotgreenright.png" alt="pulse 2" style="animation: pulse2 0.6s 7.1s infinite;">
<img class="fullscreen-image" src="./imagesdark/OvalOSWallpaper_smalldotgreenleft.png" alt="Image 2" style="animation-name: image2; animation-delay: 6.5s;">
<img class="fullscreen-image" src="./imagesdark/OvalOSWallpaper_smalldotgreenright.png" alt="Image 3" style="animation-name: image3; animation-delay: 6.5s;">
<img class="fullscreen-image" src="./imagesdark/OvalOSWallpaper_bigdotgreenleft.png" alt="Image 4" style="animation-name: image4; animation-delay: 6.4s;">
<img class="fullscreen-image" src="./imagesdark/OvalOSWallpaper_bigdotgreenright.png" alt="Image 5" style="animation-name: image5; animation-delay: 6.4s;">
<img class="fullscreen-image" src="./imagesdark/OvalOSWallpaper_blueovalbottom.png" alt="Image 6" style="animation-name: image6; animation-delay: 6.3s;">
<img class="fullscreen-image" src="./imagesdark/OvalOSWallpaper_blueovaltop.png" alt="Image 7" style="animation-name: image7; animation-delay: 6.3s;">
<img class="fullscreen-image" src="./imagesdark/OvalOSWallpaper_blueovalmiddle.png" alt="Image 8" style="animation-name: image8; animation-delay: 5.8s;">
<img class="fullscreen-image" src="./imagesdark/OvalOSWallpaper_yellowcirclemiddle.png" alt="Image 9" style="animation-name: image9; animation-delay: 6.2s;">
</body>
</html>

<script>
  function invertColors() {
    function invert(str,type){
      var t1 = str.split("(");
      var t2 = t1[1].split(")");
      var t3 = t2[0].split(",");
      t3.forEach(function(v,i){
        if(i<3){
          if(type=="color")
            t3[i] = (255 - parseInt(v))<50?120:(255 - parseInt(v));
          else
            t3[i] = (255 - parseInt(v));
        }
      })
      t3 = t3.join(",");
      return t1[0]+"("+t3+")";
    }

    //invert color and backgroundcolor of every dom node
    document.querySelectorAll('*:not([invTouch])').forEach(function(node) {
      var style  = window.getComputedStyle(node);
      node.style.backgroundColor = invert(style.backgroundColor,"back");
      node.style.color = invert(style.color,"color");
      node.setAttribute("invTouch", "true");
    });
    console.log("Colors Inverted!");
  }

  // Call the function to invert colors when needed



</script>

        const savedTaskbarApps = JSON.parse(localStorage.getItem('savedApps')) || [];

        for (const [category, apps] of Object.entries(Games)) {
            const section = document.createElement('section');
            section.id = category.toLowerCase().replace(' ', '-');
            section.innerHTML = `<h2>${category}</h2>`;
            
            const appGrid = document.createElement('div');
            appGrid.classList.add('app-grid');

            apps.forEach(app => {
                const isInstalled = savedTaskbarApps.some(savedApp => savedApp.iframeName === app.name);

                const appCard = document.createElement('div');
                appCard.classList.add('app-card');
                appCard.setAttribute('data-title', app.name);
                appCard.innerHTML = `
                    <img src="${app.icon}" alt="${app.name}">

                    <button class="get-button" ${isInstalled ? 'disabled style="pointer-events: none; background-color: #d3d3d3;"' : ''} onclick="${!isInstalled ? `fillForm(${JSON.stringify(app).replace(/"/g, '&quot;')}); sendRequest(this);` : ''}">

                    </button>
                `;

            section.appendChild(appGrid);

        function fillForm(app) {
            document.getElementById('iframeName').value = app.name;
            document.getElementById('iframeIcon').value = app.icon;
            document.getElementById('iframeURL').value = app.code;
            document.getElementById('iframemode').value = app.mode;
            document.getElementById('jsCode').value = app.data;
            document.getElementById('iframex').value = app.x_dimension;
            document.getElementById('iframey').value = app.y_dimension;
            document.getElementById('iframetop').value = app.top_distance;
            document.getElementById('iframeleft').value = app.left_distance;
            document.getElementById('widgetInput').value = app.widget;
            replaceCharacters();
        }

        function searchApps() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const sections = document.querySelectorAll('.container section');

            sections.forEach(section => {
                let hasVisibleApp = false;
                const appCards = section.querySelectorAll('.app-card');

                appCards.forEach(card => {
                    const title = card.getAttribute('data-title').toLowerCase();
                    if (title.includes(query)) {
                        card.classList.remove('hidden');
                        hasVisibleApp = true;
                    } else {
                        card.classList.add('hidden');
                    }
                });

                if (hasVisibleApp) {
                    section.querySelector('h2').classList.remove('hidden');
                } else {
                    section.querySelector('h2').classList.add('hidden');
                }
            });
        }

        function updateSavedTaskbarApps() {
            const savedTaskbarApps = JSON.parse(localStorage.getItem('savedApps')) || [];
            document.getElementById('savedIframesTaskbar').innerHTML = "";

            savedTaskbarApps.forEach(savedApp => {
                const appInStore = apps.find(app => app.name === savedApp.iframeName);

                if (appInStore) {
                    let updateNeeded = false;

                    // Compare specified properties
                    if (
                        appInStore.code !== savedApp.iframeURL ||
                        appInStore.data !== savedApp.jsCode
                    ) {
                        updateNeeded = true;
                    }

                    // Display alert message based on update status
                    if (updateNeeded) {
                        addAppToUpdateSection(appInStore);
                    }

                    const onclickAttribute = `
                        setActiveIcon(this);
                        document.getElementById('iframeName').value ='${savedApp.iframeName}';
                        document.getElementById('iframeIcon').value ='${savedApp.iframeIcon}';
                        document.getElementById('iframeURL').value ='${savedApp.iframeURL}';
                        document.getElementById('iframex').value ='${savedApp.iframex}';
                        document.getElementById('iframey').value ='${savedApp.iframey}';
                        document.getElementById('iframetop').value ='${savedApp.iframetop}';
                        document.getElementById('iframeleft').value ='${savedApp.iframeleft}';
                        ${savedApp.iframemode === 'fullscreen' ? 'createFullscreenIframe();' : savedApp.iframemode === 'none' ? '' : 'createIframe();'};
                        ${savedApp.jsCode}`;

                    const savedIframeHTML = `
                        <div class="app-container" data-iframe-name="${savedApp.iframeName}">
                            <a onclick="${onclickAttribute}" tabindex="0" class="taskbar-button">
                                <img src="${savedApp.iframeIcon}">
                            </a>
                        </div>`;

                    document.getElementById('savedIframesTaskbar').innerHTML += savedIframeHTML;
                }
            });

            document.getElementById('savedIframesTaskbar').addEventListener('contextmenu', function(event) {
                event.preventDefault();
                const target = event.target.closest('.app-container');
                if (target) {
                    const iframeName = target.dataset.iframeName;
                    showTaskbarContextMenu(event.clientX, event.clientY, iframeName);
                }
            });
        }

function addAppToUpdateSection(app) {
    const updatesSection = document.getElementById('updates');
    if (!updatesSection) return;

    const appGrid = updatesSection.querySelector('.app-grid');
    if (!appGrid) return;

    const appCard = document.createElement('div');
    appCard.classList.add('app-card');
    appCard.setAttribute('data-title', app.name);
    appCard.innerHTML = `
        <img src="${app.icon}" alt="${app.name}">
        <h3>${app.name}</h3>
        <p>${app.developer}</p>
        <button class="get-button" onclick="fillForm(${JSON.stringify(app).replace(/"/g, '&quot;')}); saveData(); location.reload();">Update</button>
    `;
    appGrid.appendChild(appCard);

    // Check if the dark mode or feature is enabled
    const isEnabled = localStorage.getItem('ovalosdarkmodeEnabled') === 'true';

    if (isEnabled) {
        // Invert colors and remove specific styles if enabled
        invertColors();

        const getButtons = document.querySelectorAll('.get-button');
        getButtons.forEach(button => {
            if (!button.hasAttribute('disabled')) {
                button.style.backgroundColor = ''; // Remove background color
                button.style.color = ''; // Remove text color
            }
        });

        // Get all elements with the specified colors
        const elementsToRemove = document.querySelectorAll('[style*="color: rgb(109, 164, 135);"], [style*="color: rgb(146, 91, 120);"]');

        // Remove the color styles
        elementsToRemove.forEach((element) => {
            element.style.removeProperty('color');
        });

        // Uncomment if you want to set a different color instead of removing
        // elementsToRemove.forEach((element) => {
        //     element.style.color = 'your-desired-color';
        // });
    }
}


function checkForUpdates() {
    const updatesSection = document.getElementById('updates');
    const updatesButton = document.getElementById('updatesButton');
    const appCards = updatesSection.querySelectorAll('.app-card');
    
    const updatesNeeded = appCards.length > 0;

    // Save the update status in localStorage
    localStorage.setItem('updatesNeeded', updatesNeeded);

    if (!updatesNeeded) {
        updatesButton.style.display = 'none';
        updatesSection.style.display = 'none';
    } else {
        updatesButton.style.display = 'flex';
        updatesSection.style.display = 'block';
    }
}

function saveHTML() {
const iframeName = document.getElementById('iframeName').value;
    const htmlCode = document.getElementById('widgetInput').value;
    if (htmlCode.trim() === '' || iframeName.trim() === '') {
        return;
    }

    let savedCodes = JSON.parse(localStorage.getItem('savedCodes')) || [];
    const existingIndex = savedCodes.findIndex(code => code.iframeName === iframeName);

    if (existingIndex !== -1) {
        savedCodes[existingIndex].htmlCode = htmlCode;  // Update the existing code
    } else {
        savedCodes.push({ htmlCode, iframeName });
    }

    localStorage.setItem('savedCodes', JSON.stringify(savedCodes));
    document.getElementById('widgetInput').value = '';
}
        function saveData() {
            // Get values from input fields
            const iframeIcon = document.getElementById('iframeIcon').value;
const iframeName = document.getElementById('iframeName').value;
            const iframeURL = document.getElementById('iframeURL').value;
            const iframemode = document.getElementById('iframemode').value.toLowerCase(); // Convert to lowercase for case-insensitivity
            const jsCode = document.getElementById('jsCode').value; // Get JS code
            const iframex = document.getElementById('iframex').value;
            const iframey = document.getElementById('iframey').value;
            const iframetop = document.getElementById('iframetop').value;
            const iframeleft = document.getElementById('iframeleft').value;

            // Check if localStorage is supported
            if (typeof(Storage) !== 'undefined') {
                // Retrieve existing app data from localStorage or initialize an empty array for start menu and taskbar
                const savedApps = JSON.parse(localStorage.getItem('savedApps')) || [];
                const savedTaskbarApps = JSON.parse(localStorage.getItem('savedTaskbarApps')) || [];

                // Check if an app with the same icon already exists in start menu
                const existingAppIndex = savedApps.findIndex(app => app.iframeIcon === iframeIcon);

                if (existingAppIndex !== -1) {
                    // Update the existing app with the new data in start menu
                    savedApps[existingAppIndex] = { iframeName, iframeIcon, iframeURL, iframemode, jsCode, iframex, iframey, iframetop, iframeleft };
                } else {
                    // Add new app data to the array in start menu
                    savedApps.push({ iframeName, iframeIcon, iframeURL, iframemode, jsCode, iframex, iframey, iframetop, iframeleft });
                }

                // Check if an app with the same icon already exists in taskbar
                const existingTaskbarAppIndex = savedTaskbarApps.findIndex(app => app.iframeIcon === iframeIcon);

                if (existingTaskbarAppIndex !== -1) {
                    // Update the existing app with the new data in taskbar
                    savedTaskbarApps[existingTaskbarAppIndex] = { iframeName, iframeIcon, iframeURL, iframemode, jsCode, iframex, iframey, iframetop, iframeleft };
                } else {
                    // Add new app data to the array in taskbar
                    savedTaskbarApps.push({ iframeName, iframeIcon, iframeURL, iframemode, jsCode, iframex, iframey, iframetop, iframeleft });
                }

                // Save the updated arrays to localStorage
                localStorage.setItem('savedApps', JSON.stringify(savedApps));
                localStorage.setItem('savedTaskbarApps', JSON.stringify(savedTaskbarApps));
            } else {
                alert('Sorry, your browser does not support localStorage.');
            }
        }


    </script>

    <script>
        function replaceCharacters() {
            const inputBox = document.getElementById('widgetInput');
            const inputValue = inputBox.value;

            // Define character replacements
            const replacements = {
                '(ovalquote)': '"',
                '(ovalapost)': "'",
                '(ovalcurlo)': '{',
                '(ovalcurlc)': '}',
                '(ovalbraco)': '[',
                '(ovalbracc)': ']',
                '(ovalcomma)': ',',
                '(ovalbtick)': '`',
                '(ovalanglo)': '<',
                '(ovalanglc)': '>',
                '(ovalcolon)': ':',
                '(ovalsolon)': ';'
            };

            // Replace characters
            let replacedValue = inputValue;
            for (const key in replacements) {
                replacedValue = replacedValue.replace(new RegExp(key, 'g'), replacements[key]);
            }

            inputBox.value = replacedValue; // Update the input box value
        }
    </script>

<script>
    function sendRequest(button) {
        // Clear any old response before sending a new request
        localStorage.removeItem('response');

        button.classList.add('loading');
        button.classList.remove('get-button');
        button.textContent = '‎ ‎ ‎ ‎ ‎ ‎ ';
        button.disabled = true;
        
        // Simulating a request to the second page
        localStorage.setItem('requestSent', 'true');
        
        // Wait for the second page to process the request
        setTimeout(() => checkResponse(button), 1000);
    }

    function checkResponse(button) {
        const response = localStorage.getItem('response');
        
        if (response === 'yes') {
            console.log('Response is yes, executing function1');
            function1();
            localStorage.removeItem('response');
            resetRequestButton(button);
        } else if (response === 'no') {
            console.log('Response is no, resetting button');
            resetRequestButton(button);
            localStorage.removeItem('response');
        } else {
            console.log('No response yet, retrying after 2 seconds');
            setTimeout(() => checkResponse(button), 2000); // Increased delay to 2 seconds
        }
    }

    function resetRequestButton(button) {
        button.classList.remove('loading');
        button.classList.add('get-button');
        button.textContent = 'Get';
        button.disabled = false;
    }

    function function1() {
        console.log('Function1 executed');
        saveSoftware();
        location.reload();
    }
</script>

<script>
    document.getElementById('fileInput').addEventListener('change', function(event) {
        const file = event.target.files[0];
        if (file && file.name.endsWith('.oval')) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const content = e.target.result;

                // Use regular expressions to extract values between quotes and backticks
                const name = content.match(/name:\s*"(.*?)"/)?.[1] || '';
                const developer = content.match(/developer:\s*"(.*?)"/)?.[1] || '';
                const category = content.match(/category:\s*"(.*?)"/)?.[1] || '';
                const icon = content.match(/icon:\s*"(.*?)"/)?.[1] || '';
                const mode = content.match(/mode:\s*"(.*?)"/)?.[1] || '';
                const data = content.match(/data:\s*"(.*?)"/)?.[1] || '';
                const x_dimension = content.match(/x_dimension:\s*(\d*)/)?.[1] || '';
                const y_dimension = content.match(/y_dimension:\s*(\d*)/)?.[1] || '';
                const top_distance = content.match(/top_distance:\s*(\d*)/)?.[1] || '';
                const left_distance = content.match(/left_distance:\s*(\d*)/)?.[1] || '';
                const code = content.match(/code:\s*"(.*?)"/)?.[1] || '';
                const widget = content.match(/widget:\s*`(.*?)`/)?.[1] || '';

                // Populate the form fields with the extracted values
                document.getElementById('iframeName').value = name;
                document.getElementById('iframeIcon').value = icon;
                document.getElementById('iframeURL').value = code;
                document.getElementById('iframemode').value = mode;
                document.getElementById('jsCode').value = data;
                document.getElementById('iframex').value = x_dimension;
                document.getElementById('iframey').value = y_dimension;
                document.getElementById('iframetop').value = top_distance;
                document.getElementById('iframeleft').value = left_distance;
                document.getElementById('widgetInput').value = widget;
                document.getElementById('iframeNameInput').value = name;

                // Automatically save the loaded data and clear the form
                replaceCharacters();
sendRequestsideload();
            };
            reader.readAsText(file);
        } else {
            alert('Please upload a valid .oval file.');
        }
    });

    // Display file uploader form when "Sideload" button is clicked
    document.querySelector('nav a[href="#updates"]').addEventListener('click', function() {
        document.getElementById('fileUploader').classList.toggle('hidden');
    });

    function clearForm() {
        document.getElementById('dataForm').reset();
        document.getElementById('fileInput').value = '';
    }
</script>

<!-- Inter font -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

<!-- Styles -->
<style>
  body {
    font-family: 'Inter', sans-serif;
text-align: center;
  }
  .btn {
    padding: 14px 22px;
    border: none;
    border-radius: 24px;
    margin: 10px;
    cursor: pointer;
    font-size: 16px;
    font-weight: 500;
    font-family: inherit;
transition: 0.2s ease;
  }

.btn:hover {
background: #a8c3f0;
transition: 0.2s ease;
}
  .btn-remove {
    background: #cccccc;
    color: #333;
  }
  .btn-remove:hover {
    background: #f0b2a8;
    color: #333;
  }
  .btn-apply {
    background: #4285f4;
    color: white;
  }
  .btn-character {
    background: #7daafc;
    color: white;
margin: 0px;
padding: 7px 22px;
  }

  #codeContainer {
background:rgba(240, 240, 240, 1);
backdrop-filter: saturate(100%) blur(14px);
}

  .toast {
    position: fixed;
font-family: 'Inter', sans-serif;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    background-color: #333;
    color: white;
    padding: 12px 20px;
    border-radius: 40px;
    font-family: sans-serif;
    font-size: 16px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease, transform 0.4s ease;
    z-index: 9999;
  }

  .toast.show {
    opacity: 1;
    pointer-events: auto;
    transform: translateX(-50%) translateY(0);
  }
</style>


<!-- UI -->
<img style="margin-top: 100px; height: 80px; border-radius: 17px;" src="https://koolkat226.github.io/oos/images/christmasicon.png">
<h2 style="font-size: 24px; font-weight: 600;">FALLLLL Theme Pack</h2>
<p style="margin-left: 25%; width: 50%;">This theme pack will visually change the look of OlexOS and potentially modify system settings, only proceed if this content is from a trusted source.</p>
<div id="editor-container">
<textarea style="display:none" id="codeInput" placeholder="Type JavaScript code here…">
</textarea>

<!-- Buttons -->
<button class="btn btn-remove"  id="removeBtn">Remove Theme</button>
<button class="btn btn-apply" onclick="location.reload();" id="saveBtn">Apply Theme</button>
</div>
<br>
<button style="display:none;" class="btn btn-character" onclick="document.getElementById('colC').value = './emoji/orbs/1.png, ./emoji/mouths/1.png, ./emoji/eyes/1.png, ./emoji/hairs/1.png, ./emoji/eyewear/1.png, ./emoji/hats/1.png'; showToast();">Apply Custom Character</button>
<script>
  function showToast(message = "OOSmoji Updated, Visual changes will take effect on restart") {
    const toast = document.createElement("div");
    toast.className = "toast";
    toast.textContent = message;
    document.body.appendChild(toast);

    // Trigger animation
    requestAnimationFrame(() => toast.classList.add("show"));

    // Remove after 3 seconds
    setTimeout(() => {
      toast.classList.remove("show");
      setTimeout(() => toast.remove(), 400);
    }, 3000);
  }
</script>
<script>
(function () {
  const STORAGE_KEY = 'savedHTMLContent';
  let isEditorInitialized = false;
  let injectedContainer = null;
  let injectedScripts = [];

  function injectHTML(content) {
    if (injectedContainer) {
      injectedContainer.remove();
      injectedContainer = null;
    }
    injectedScripts.forEach(s => s.remove());
    injectedScripts = [];

    if (!content) return;

    injectedContainer = document.createElement('div');
    injectedContainer.id = 'injected-container';

    const temp = document.createElement('div');
    temp.innerHTML = content;

    temp.querySelectorAll('script').forEach(oldScript => {
      const newScript = document.createElement('script');
      Array.from(oldScript.attributes).forEach(attr =>
        newScript.setAttribute(attr.name, attr.value)
      );
      newScript.textContent = oldScript.textContent;
      document.body.appendChild(newScript);
      injectedScripts.push(newScript);
      oldScript.remove();
    });

    while (temp.firstChild) {
      injectedContainer.appendChild(temp.firstChild);
    }

    document.body.appendChild(injectedContainer);
  }

  function initEditor() {
    if (isEditorInitialized) return;
    isEditorInitialized = true;

    const textarea = document.getElementById('codeInput');
    const saveBtn = document.getElementById('saveBtn');
    const removeBtn = document.getElementById('removeBtn');

    // Load into textarea (if any)
    const existing = localStorage.getItem(STORAGE_KEY);
    if (existing) textarea.value = existing;

    // Apply Theme button
    saveBtn?.addEventListener('click', () => {
      const html = textarea.value;
      localStorage.setItem(STORAGE_KEY, html);
      injectHTML(html);
    });

    // Remove Theme button
    removeBtn?.addEventListener('click', () => {
      localStorage.removeItem(STORAGE_KEY);
      injectHTML('');
      textarea.value = '';
    });
  }

  window.addEventListener('DOMContentLoaded', () => {
    // ❗ REMOVE ANY SAVED THEME ON PAGE LOAD
    localStorage.removeItem(STORAGE_KEY);
    injectHTML('');
    window.location.href = "./winter.html";

    // Clear editor textarea since theme was removed
    const textarea = document.getElementById('codeInput');
    if (textarea) textarea.value = '';

    if (document.getElementById('editor-container')) {
      initEditor();
    } else {
      new MutationObserver(handleMutations)
        .observe(document.body, { childList: true, subtree: true });
    }
  });

  function handleMutations(mutations) {
    for (const m of mutations) {
      for (const node of m.addedNodes) {
        if (
          node instanceof HTMLElement &&
          (node.id === 'editor-container' || node.querySelector?.('#editor-container'))
        ) {
          initEditor();
        }
      }
      for (const node of m.removedNodes) {
        if (
          node instanceof HTMLElement &&
          (node.id === 'editor-container' || node.querySelector?.('#editor-container'))
        ) {
          isEditorInitialized = false;
        }
      }
    }
  }
})();
</script>
